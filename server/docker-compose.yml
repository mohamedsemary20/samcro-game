services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: samkaro
      POSTGRES_USER: samkaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - samkaro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samkaro -d samkaro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  samkaro-postgres:
