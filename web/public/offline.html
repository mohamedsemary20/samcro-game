<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101215" />
    <title>سمكرو · غير متصل</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #101215; color: #f2ede2; font-family: Tajawal, Arial, sans-serif; }
      main { width: min(440px, 100%); border: 1px solid #c5a46d55; border-radius: 20px; padding: 30px; background: #1b1e22; text-align: center; }
      img { width: 78px; height: 78px; border: 1px solid #c5a46d66; border-radius: 17px; }
      h1 { margin: 18px 0 8px; color: #e3c78f; }
      p { color: #c4bdae; line-height: 1.8; }
      button { min-height: 48px; border: 0; border-radius: 12px; padding: 10px 18px; background: #d2b476; color: #191713; font: 700 16px Tajawal, Arial, sans-serif; }
    </style>
  </head>
  <body><main><img src="/assets/app-logo.png" alt="" /><h1>الشبكة فصلت</h1><p>سمكرو محتاجة إنترنت عشان تزامن الغرفة وتلعب مع أصحابك. ارجع للشبكة وجرب تاني.</p><button type="button" onclick="location.reload()">حاول تاني</button></main></body>
</html>
