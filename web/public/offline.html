<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17191C" />
    <meta name="color-scheme" content="dark" />
    <title>سمكرو · غير متصل</title>
    <style>
      @font-face {
        font-family: Tajawal;
        src: url('/assets/tajawal.ttf') format('truetype');
        font-display: swap;
      }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: #17191c; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: #17191c;
        color: #f5f5f5;
        font-family: Tajawal, Arial, sans-serif;
      }
      main {
        width: min(420px, 100%);
        border: 1px solid #ffffff14;
        border-radius: 26px;
        padding: 34px 26px 28px;
        background: #202328;
        box-shadow: 0 24px 60px #00000045, inset 0 1px 0 #ffffff0d;
        text-align: center;
      }
      .mark {
        width: 70px;
        height: 70px;
        display: grid;
        place-items: center;
        margin: 0 auto;
        border: 1px solid #ff8a3259;
        border-radius: 22px;
        background: #292d32;
        color: #ff8a32;
        box-shadow: 0 0 0 7px #ff8a320f;
      }
      .mark svg { width: 34px; height: 34px; }
      h1 { margin: 22px 0 8px; font-size: 1.55rem; letter-spacing: -0.02em; }
      p { margin: 0 auto; max-width: 31ch; color: #a5a9af; font-size: 0.98rem; line-height: 1.85; }
      .hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 18px 0 0;
        color: #727780;
        font-size: 0.82rem;
      }
      .hint::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff8a32; }
      button {
        width: 100%;
        min-height: 52px;
        margin-top: 24px;
        border: 1px solid #ff9d5066;
        border-radius: 15px;
        padding: 12px 20px;
        background: #ff8a32;
        color: #17191c;
        font: 700 1rem Tajawal, Arial, sans-serif;
        cursor: pointer;
        box-shadow: 0 10px 28px #ff8a3226;
      }
      button:hover { background: #ff9d50; }
      button:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        main { animation: rise 380ms ease-out both; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5 6.5 11 12 5l5.5 6L21 8.5 19 18H5L3 8.5Z" />
          <path d="M5 21h14" />
        </svg>
      </span>
      <h1>الشبكة فصلت</h1>
      <p>سمكرو محتاجة إنترنت عشان تزامن الغرفة وتلعب مع أصحابك. ارجع للشبكة وجرب تاني.</p>
      <p class="hint">جلسة اللعب محفوظة على السيرفر</p>
      <button type="button" onclick="location.reload()">حاول تاني</button>
    </main>
  </body>
</html>
