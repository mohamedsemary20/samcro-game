<!-- Backspace Single -->

</svg>

<script>
  (function () {
    let rawNumber = "33500000";
    let timeLeft = 18;
    const maxTime = 30;
    const circumference = 2 * Math.PI * 28; // ~175.929

    const display = document.getElementById("guessDisplay");
    const timerText = document.getElementById("timerSeconds");
    const timerProgress = document.getElementById("timerProgress");
    const clearBtn = document.getElementById("btnClear");
    const backspaceBtn = document.getElementById("btnBackspace");
    const submitBtn = document.getElementById("btnSubmitGuess");

    function formatNumber(val) {
      if (!val || val === "0") return "0";
      return Number(val).toLocaleString("en-US");
    }

    function updateDisplay() {
      display.textContent = formatNumber(rawNumber);
      if (rawNumber.length > 10) {
        display.className = "font-headline-sm text-headline-sm tracking-wider text-primary text-center flex-1 font-bold overflow-x-auto whitespace-nowrap px-2 direction-ltr";
      } else {
        display.className = "font-headline-lg text-headline-lg tracking-wider text-primary text-center flex-1 font-bold overflow-x-auto whitespace-nowrap px-2 direction-ltr";
      }
    }

    // Number Pad Interactions
    document.querySelectorAll(".key-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-key");
        if (rawNumber === "0") {
          rawNumber = key === "000" ? "0" : key;
        } else if (rawNumber.length < 13) {
          rawNumber += key;
        }
        updateDisplay();
      });
    });

    // Backspace Single Character
    backspaceBtn.addEventListener("click", () => {
      if (rawNumber.length > 1) {
        rawNumber = rawNumber.slice(0, -1);
      } else {
        rawNumber = "0";
      }
      updateDisplay();
    });

    // Full Clear
    clearBtn.addEventListener("click", () => {
      rawNumber = "0";
      updateDisplay();
    });

    // Interactive Submit Feedback
    submitBtn.addEventListener("click", () => {
      submitBtn.classList.add("scale-95", "opacity-90");
      setTimeout(() => {
        submitBtn.classList.remove("scale-95", "opacity-90");
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[22px] animate-bounce">task_alt</span>
          <span>تم اعتماد التخمين!</span>
        `;
        submitBtn.classList.remove("bg-gradient-to-b", "from-primary-fixed", "to-primary-container", "text-on-primary-container");
        submitBtn.classList.add("bg-secondary-container", "text-on-secondary-container");
      }, 150);
    });

    // Tension Timer Countdown Tick
    const countdown = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft -= 1;
        timerText.textContent = timeLeft;
        const offset = circumference - (timeLeft / maxTime) * circumference;
        timerProgress.style.strokeDashoffset = offset;

        // Visual Tension Pulse under 5 seconds
        if (timeLeft <= 5) {
          timerProgress.classList.remove("text-primary-container");
          timerProgress.classList.add("text-error");
          timerText.classList.remove("text-primary");
          timerText.classList.add("text-error");
        }
      } else {
        clearInterval(countdown);
        submitBtn.click();
      }
    }, 1000);

    updateDisplay();
  })();
</script></main></body></html>
